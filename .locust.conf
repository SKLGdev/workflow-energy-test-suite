# Configuración por defecto para Locust
# Puedes sobrescribir estos valores con argumentos de línea de comandos
# El locustfile.py se encuentra en tests/load/locustfile.py

# Host por defecto
host = https://workflow-energy.vercel.app

# Número de usuarios simultáneos
users = 10

# Tasa de crecimiento de usuarios (usuarios por segundo)
spawn-rate = 2

# Tiempo de ejecución (opcional, en formato: 1h30m, 10m, 30s)
# run-time = 5m

# Headless mode (sin interfaz web)
headless = false

# Web UI host y port
web-host = 0.0.0.0
web-port = 8089

